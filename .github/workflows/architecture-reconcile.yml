name: Architecture Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile legacy boundary envelopes
        run: python3 tools/reconcile_architecture.py

      - name: Commit mechanical reconciliation
        run: |
          if git diff --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quantum/task_memory.py esa-exoskeleton/public/components/ESA.GSAPTransport.js esa-exoskeleton/public/components/ESA.Ptac-B.js esa-exoskeleton/docs/service-broadcast-cards.md
          git commit -m "chore(boundary): remove legacy cognitive envelopes"
          git push

      - name: Verify Agent-X boundary
        run: |
          set -e
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock' \
            -E 'cognitive_state|chain_of_thought|(^|[^A-Za-z])reasoning([^A-Za-z]|$)' \
            src esa-exoskeleton 2>/dev/null; then
            echo "ERROR: cognitive-state/reasoning ownership leaked into Agent-X."
            exit 1
          fi
          echo "Agent-X boundary clean."
