name: Deploy ESA Exoskeleton to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'esa-exoskeleton/public/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy esa-exoskeleton/public --project-name=esa-exoskeleton --branch=main

      - name: Deployment Success
        run: |
          echo "✅ ESA EXOSKELETON deployed to Cloudflare Pages"
          echo "🌐 URL: https://esa-exoskeleton.pages.dev"
