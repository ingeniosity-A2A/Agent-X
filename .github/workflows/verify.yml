name: Verify

on:
  push:
  pull_request:

jobs:
  checks:
    name: Syntax + isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js console syntax (both exoskeletons)
        run: |
          find esa-exoskeleton -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check || exit 1

      - name: Python backend compile
        run: |
          python -m py_compile $(find src -name '*.py' -print) || exit 1

      - name: Exoskeleton import containment
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const roots = ["esa-exoskeleton/public", "esa-exoskeleton/public/esa-console"];
            let bad = 0;
            for (const root of roots) {
              const files = [];
              const walk = d => { for (const f of fs.readdirSync(d)) { const p = path.join(d, f); const s = fs.statSync(p); if (s.isDirectory()) walk(p); else if (f.endsWith(".js")) files.push(p); } };
              walk(root);
              for (const f of files) {
                const src = fs.readFileSync(f, "utf8");
                const re = /(?:from|import\()\s*[\x27"]([^\x27"]+)[\x27"]/g;
                let m;
                while ((m = re.exec(src))) {
                  if (!m[1].startsWith(".")) continue; // external URL imports are fine
                  const target = path.resolve(path.dirname(f), m[1].replace(/\.js$/, "")) + ".js";
                  if (!fs.existsSync(target)) { console.error("MISSING " + f + " -> " + m[1]); bad++; }
                  if (!target.startsWith(path.resolve(root) + path.sep)) {
                    console.error("LEAK " + f + " -> " + m[1] + " escapes " + root); bad++;
                  }
                }
              }
            }
            if (bad) process.exit(1);
            console.log("Isolation OK: both exoskeletons self-contained");
          '

      - name: Hub event symmetry (dispatched vs labeled)
        run: |
          cd esa-exoskeleton/public
          node -e '
            const fs = require("fs"), path = require("path");
            function checkConsole(root) {
              const files = [];
              const walk = d => { for (const f of fs.readdirSync(d)) { const p = path.join(d, f); const s = fs.statSync(p); if (s.isDirectory()) walk(p); else if (f.endsWith(".js")) files.push(p); } };
              walk(root);
              const dispatched = new Set(), labeled = new Set();
              for (const f of files) {
                const src = fs.readFileSync(f, "utf8");
                for (const m of src.matchAll(/CustomEvent\(\x27(esa:[a-z-]+)\x27/g)) dispatched.add(m[1]);
                for (const m of src.matchAll(/\x27(esa:[a-z-]+)\x27/g)) labeled.add(m[1]);
              }
              const unlabeled = [...dispatched].filter(e => !labeled.has(e));
              if (unlabeled.length) { console.error(root + " unlabeled events: " + unlabeled.join(", ")); process.exitCode = 1; }
              else console.log(root + " events symmetric (" + dispatched.size + " dispatched)");
            }
            checkConsole(".");
            checkConsole("esa-console");
          '
