<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESA EXOSKELETON</title>
  
  <!-- Cache Busting: Force fresh load -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- GSAP (GreenSock Animation Platform) - TRANSPORT LAYER -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #282828;
      color: #ebdbb2;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* Loading Screen - PRODUCTION STYLE */
    #esa-loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1d2021 0%, #282828 50%, #32302f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    
    #esa-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .esa-loader {
      width: 60px;
      height: 60px;
      border: 3px solid #3c3836;
      border-top: 3px solid #d79921;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .esa-loading-brand {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    .esa-loading-title {
      color: #d79921;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    
    .esa-loading-subtitle {
      color: #a89984;
      font-size: 12px;
      letter-spacing: 1px;
    }
    
    /* Error Screen */
    #esa-error {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #282828;
      z-index: 9998;
      padding: 40px;
      text-align: center;
    }
    
    #esa-error.visible {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .esa-error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .esa-error-title {
      color: #cc241d;
      font-size: 20px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    
    .esa-error-message {
      color: #ebdbb2;
      font-size: 14px;
      max-width: 500px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }
    
    .esa-error-retry {
      background: #d79921;
      color: #282828;
      border: none;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .esa-error-retry:hover {
      background: #fabd2f;
    }
    
    /* Main App Container */
    #esa-exoskeleton {
      min-height: 100vh;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    
    #esa-exoskeleton.visible {
      opacity: 1;
    }
    
    /* Header */
    .esa-header {
      background: #32302f;
      border: 1px solid #3c3836;
      border-radius: 8px;
      padding: 16px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .esa-title {
      color: #d79921;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .esa-status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #1d2021;
      border: 1px solid #3c3836;
      border-radius: 20px;
      font-size: 11px;
      color: #689d6a;
    }
    
    .esa-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #689d6a;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #282828; }
    ::-webkit-scrollbar-thumb { background: #3c3836; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #504945; }
    
    /* Component Containers - CLEAN, NO FALLBACK TEXT */
    [id^="esa-"] {
      background: #32302f;
      border: 1px solid #3c3836;
      border-radius: 12px;
      padding: 16px;
      min-height: 100px;
    }
    
    /* Hidden utility */
    .esa-hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- LOADING SCREEN - PRODUCTION BRANDING -->
  <div id="esa-loading">
    <div class="esa-loader"></div>
    <div class="esa-loading-brand">
      <div class="esa-loading-title">ESA EXOSKELETON</div>
      <div class="esa-loading-subtitle">Enterprise Service Assistant</div>
    </div>
  </div>
  
  <!-- ERROR SCREEN -->
  <div id="esa-error">
    <div class="esa-error-icon">⚠️</div>
    <div class="esa-error-title">System Initialization Failed</div>
    <div class="esa-error-message" id="esa-error-message">
      The ESA Exoskeleton failed to load. Please check your connection and try again.
    </div>
    <button class="esa-error-retry" onclick="location.reload()">Reload System</button>
  </div>
  
  <!-- MAIN APPLICATION -->
  <div id="esa-exoskeleton">
    <!-- Header -->
    <header class="esa-header">
      <h1 class="esa-title">
        <span>🛡️</span>
        <span>ESA EXOSKELETON</span>
      </h1>
      <div class="esa-status-badge">
        <div class="esa-status-dot"></div>
        <span>SYSTEM ONLINE</span>
      </div>
    </header>
    
    <!-- Main Grid: Ingestion + Console (HIDDEN CONSOLE - DEV REMOVED) -->
    <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 20px;">
      <!-- AI INGESTION CHAT BOX -->
      <div id="esa-ingestion">
        <!-- Component mounts here - no fallback text -->
      </div>
      
      <!-- Button Panel (belongs to Ingestion -->
      <div id="esa-button-panel" style="display: flex; align-items: flex-start; justify-content: center; padding-top: 32px;">
        <!-- Button panel mounts here -->
      </div>
    </div>
    
    <!-- Diagnostic Card -->
    <div id="esa-diagnostics" style="margin-bottom: 20px;"></div>
    
    <!-- Parts Card -->
    <div id="esa-parts-card" style="margin-bottom: 20px;"></div>
    
    <!-- Workorder System -->
    <div id="esa-workorder" style="margin-bottom: 20px;"></div>
    
    <!-- Daily Maintenance Checklist -->
    <div id="esa-maintenance-checklist" style="margin-bottom: 20px;"></div>
    
    <!-- Hidden Sandbox (for dynamic components) -->
    <div id="esa-sandbox" class="esa-hidden"></div>
  </div>
  
  <!-- ERROR HANDLING SCRIPT -->
  <script>
    window.ESA_ERRORS = [];
    
    window.addEventListener('error', function(e) {
      console.error('[ESA]', e.message);
      window.ESA_ERRORS.push({
        message: e.message,
        file: e.filename,
        line: e.lineno,
        timestamp: new Date().toISOString()
      });
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[ESA] Promise:', e.reason);
      window.ESA_ERRORS.push({
        message: 'Promise: ' + (e.reason?.message || e.reason),
        timestamp: new Date().toISOString()
      });
    });
    
    // Timeout fallback
    setTimeout(function() {
      var loading = document.getElementById('esa-loading');
      var exoskeleton = document.getElementById('esa-exoskeleton');
      
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        if (exoskeleton) exoskeleton.classList.add('visible');
      }
    }, 8000);
  </script>
  
  <!-- DuckDB WASM (optional) -->
  <script type="module">
    try {
      import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm')
        .then(mod => {
          window.duckdb = mod.default || mod;
        })
        .catch(() => {
          window.duckdb = null;
        });
    } catch (e) {
      window.duckdb = null;
    }
  </script>
  
  <!-- MAIN APPLICATION MODULE -->
  <script type="module" src="./integration.js?v=300"></script>
</body>
</html>
