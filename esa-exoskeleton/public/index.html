<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESA EXOSKELETON</title>
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <!-- DuckDB WASM -->
  <script type="module">
    import duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';
    window.duckdb = duckdb;
  </script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #282828;
      color: #ebdbb2;
      overflow-x: hidden;
    }
    #esa-exoskeleton {
      min-height: 100vh;
      padding: 20px;
    }
    .esa-header {
      background: #32302f;
      border: 1px solid #3c3836;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .esa-title {
      color: #d79921;
      font-size: 24px;
      font-weight: bold;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #282828; }
    ::-webkit-scrollbar-thumb { background: #3c3836; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #504945; }
  </style>
</head>
<body>
  <div id="esa-exoskeleton">
    <!-- Header -->
    <header class="esa-header">
      <h1 class="esa-title">🛡️ ESA EXOSKELETON</h1>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span style="color: #a89984; font-size: 12px;">v2.5.0</span>
      </div>
    </header>
    
    <!-- Main Grid -->
    <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-bottom: 20px;">
      <!-- ESA Console -->
      <div id="esa-console" style="
        background: #1d2021;
        border: 1px solid #3c3836;
        border-radius: 8px;
        padding: 16px;
        min-height: 400px;
      ">
        <h3 style="color: #689d6a; margin-bottom: 12px;">📟 ESA CONSOLE</h3>
        <div id="esa-console-output" style="
          font-family: 'Courier New', monospace;
          font-size: 12px;
          height: 350px;
          overflow-y: auto;
        "></div>
      </div>
      
      <!-- Sidebar (AI Ingestion) -->
      <div id="esa-ingestion" style="
        background: #32302f;
        border: 1px solid #3c3836;
        border-radius: 8px;
        padding: 16px;
      "></div>
    </div>
    
    <!-- Bottom Section -->
    <div style="display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; margin-bottom: 20px;">
      <!-- ESA Ingestion Bottom -->
      <div id="esa-ingestion-bottom"></div>
      
      <!-- ESA Button Panel (BELONGS TO AI INGESTION) -->
      <div id="esa-button-panel"></div>
    </div>
    
    <!-- ESA Diagnostic Card -->
    <div id="esa-diagnostics" style="margin-bottom: 20px;"></div>
    
    <!-- ESA Broadcast Parts Card -->
    <div id="esa-parts-card"></div>
    
    <!-- ESA Workorder System -->
    <div id="esa-workorder"></div>
    
    <!-- Hidden Sandbox -->
    <div id="esa-sandbox" style="display: none;"></div>
  </div>
  
  <!-- Load ESA Components -->
  <script type="module" src="../integration.js"></script>
</body>
</html>
