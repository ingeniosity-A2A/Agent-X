# Onomondo + NCS — cellular / IoT networking (template)
# Apply inside an nRF Connect SDK application workspace.

# Cellular baseband control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_NET_L2_ETHERNET=n

# Embedded TCP/IP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# MQTT toward cloud / Onomondo-side connectors (app-dependent)
CONFIG_MQTT_LIB=y

# Optional: modem info / residual link diagnostics
CONFIG_MODEM_INFO=y

# SoftSIM: provision via Onomondo CLI + NCS packages for Nordic.
# Do not commit secrets (ICCID profiles, API keys) into this file.
